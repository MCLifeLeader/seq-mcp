name: seq-otlp
type: server
image: "mcp/seq-otlp:latest"
description: Unofficial standalone MCP server for Datalust Seq OpenTelemetry access.
title: Seq OTLP
readme: https://raw.githubusercontent.com/MCLifeLeader/seq-mcp/main/README.md
remote: {}
secrets:
    - name: seq-otlp.api_key
      env: SEQ_API_KEY
env:
    - name: SEQ_URL
      value: "{{seq-otlp.url}}"
config:
    - description: Configure the connection to Seq.
      name: seq-otlp
      properties:
          url:
              type: string
      required:
          - url
      type: object
tools:
    - name: seq_agent_guide
      description: Return concise guidance that tells AI agents how to choose Seq MCP tools, recommended workflows, example calls, and safety limits.
      arguments: []
    - name: seq_connection_test
      description: Validate Seq connectivity, authentication, resolved API base URL, and host-root health endpoint.
      arguments:
          - name: includeApiInfo
            type: boolean
            desc: When true, also fetch the Seq API root document.
            optional: true
    - name: seq_starter_help
      description: List common starter tools and the recommended process for AI agents using this Seq MCP server.
      arguments: []
    - name: seq_starter_overview
      description: "Run a safe read-only overview: API root, current user, diagnostics status, shared/personal signals, and shared/personal workspaces."
      arguments: []
    - name: seq_starter_events_search
      description: Search Seq events with a bounded count, optional Seq filter, signal id/name, UTC time window, and rendered message output.
      arguments:
          - name: filter
            type: string
            desc: "Seq filter expression, for example @Level = 'Error' or RequestPath like '/api%'. Common @Level aliases are expanded."
            optional: true
          - name: signal
            type: string
            desc: Optional Seq signal id/name to scope the event search.
            optional: true
          - name: count
            type: integer
            desc: Maximum events to return, from 1 to 500. Default 50.
            optional: true
          - name: fromDateUtc
            type: string
            desc: "Inclusive UTC start time, for example 2026-05-11T00:00:00Z."
            optional: true
          - name: toDateUtc
            type: string
            desc: "Exclusive UTC end time, for example 2026-05-11T01:00:00Z."
            optional: true
          - name: render
            type: boolean
            desc: When true, ask Seq to include rendered event messages.
            optional: true
    - name: seq_starter_event_by_id
      description: Fetch one Seq event by event id, optionally including rendered message text.
      arguments:
          - name: id
            type: string
            desc: Seq event id.
          - name: render
            type: boolean
            desc: When true, ask Seq to include rendered event message text.
            optional: true
    - name: seq_starter_data_query
      description: Run a bounded Seq data query using the q language for aggregation, projection, and analysis.
      arguments:
          - name: q
            type: string
            desc: "Seq q query, for example select count(*) as Count from stream. Keep it scoped with time range/count when possible."
          - name: signalId
            type: string
            desc: Optional signal id to scope the query.
            optional: true
          - name: fromDateUtc
            type: string
            desc: "Inclusive UTC start time, for example 2026-05-11T00:00:00Z."
            optional: true
          - name: toDateUtc
            type: string
            desc: "Exclusive UTC end time, for example 2026-05-11T01:00:00Z."
            optional: true
          - name: count
            type: integer
            desc: Maximum rows/events to return, from 1 to 500. Default 100.
            optional: true
          - name: usePost
            type: boolean
            desc: "Use POST for long q queries; GET is the default."
            optional: true
    - name: seq_starter_signals_list
      description: List shared and personal Seq signals visible to the configured API key.
      arguments: []
    - name: seq_starter_signal_by_id
      description: Fetch one Seq signal by id.
      arguments:
          - name: id
            type: string
            desc: Seq signal id.
    - name: seq_starter_dashboards_list
      description: List shared and personal Seq dashboards visible to the configured API key.
      arguments: []
    - name: seq_starter_alerts_list
      description: List shared and personal Seq alerts visible to the configured API key.
      arguments: []
    - name: seq_starter_events_stream
      description: Poll the bounded Seq events stream endpoint for recent/new events with optional filter and signal scope.
      arguments:
          - name: filter
            type: string
            desc: Optional Seq filter expression for streamed events.
            optional: true
          - name: signal
            type: string
            desc: Optional Seq signal id/name to scope streamed events.
            optional: true
          - name: wait
            type: integer
            desc: Long-poll wait seconds, from 0 to 30. Default 5.
            optional: true
          - name: render
            type: boolean
            desc: When true, ask Seq to include rendered event messages.
            optional: true
    - name: seq_api_catalog
      description: Search the built-in official Seq route catalog by method, permission, or text before making advanced API calls.
      arguments:
          - name: method
            type: string
            desc: Optional HTTP method filter.
            optional: true
          - name: permission
            type: string
            desc: Optional Seq permission filter such as Public, Read, Write, Project, Organization, or System.
            optional: true
          - name: search
            type: string
            desc: Case-insensitive text search across route, permission, requirements, and notes.
            optional: true
          - name: includeNotes
            type: boolean
            desc: When true, include notes from the route catalog.
            optional: true
    - name: seq_api_live_links
      description: Discover route links advertised by the connected Seq instance, useful for comparing live routes with the static catalog.
      arguments:
          - name: sourceFilter
            type: string
            desc: Optional case-insensitive source route filter, for example api/events/resources.
            optional: true
    - name: seq_api_request
      description: Execute an advanced Seq API request against an official cataloged route template. Use seq_api_catalog first to choose method/path.
      arguments:
          - name: method
            type: string
            desc: HTTP method matching an entry from seq_api_catalog.
          - name: path
            type: string
            desc: Official Seq route template from seq_api_catalog, for example api/events/{id}. Do not include a leading slash.
          - name: pathParams
            type: object
            desc: "Named values for route template placeholders, for example { id: 'event-123' } for api/events/{id}. Values are URL-encoded by the server."
            optional: true
          - name: query
            type: object
            desc: "Seq query string parameters as string values. Keep filters/time ranges/counts bounded; use the starter tools for common query shapes."
            optional: true
          - name: body
            type: "object | array | string | number | boolean | null"
            desc: JSON-compatible request body for routes that accept one. Omit for GET routes unless the Seq API route explicitly documents a body.
            optional: true
          - name: contentType
            type: string
            desc: Request Content-Type. Defaults to application/json when body is supplied.
            optional: true
metadata:
    category: observability
    tags:
        - seq
        - otlp
        - opentelemetry
        - observability
    license: MIT
    owner: MCLifeLeader
