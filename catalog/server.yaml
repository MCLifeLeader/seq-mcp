name: seq-otel
image: mcp/seq-otel
type: server
meta:
    category: observability
    tags:
        - seq
        - datalust
        - opentelemetry
        - logs
        - observability
        - troubleshooting
about:
    title: Seq OTel MCP Server
    description: Agent-friendly MCP server for querying Datalust Seq logs, OpenTelemetry data, diagnostics, signals, dashboards, alerts, and official Seq API routes with bounded requests.
    icon: https://raw.githubusercontent.com/MCLifeLeader/seq-mcp/main/assets/seq-otel-icon.svg
source:
    type: github
    url: https://github.com/MCLifeLeader/seq-mcp
    ref: main
    path: /
config:
    transport: stdio
    command:
        type: docker
        configSchema:
            type: object
            properties:
                seq_url:
                    type: string
                    description: Seq base URL (recommended) or API URL (for example https://seq.example.com).
            required:
                - seq_url
    description: Configure connection settings for the target Seq instance. Agents should begin with seq_agent_guide, seq_connection_test, and seq_starter_overview before using advanced API routes.
    env:
        - name: SEQ_URL
          description: URL for the target Seq server root (recommended) or /api endpoint.
          example: https://seq.example.com
          value: "{{seq-otel.seq_url}}"
    secrets:
        - name: seq-otel.seq_api_key
          env: SEQ_API_KEY
          description: Seq API key with required permissions for selected operations.
          example: <SEQ_API_KEY>
          required: true
